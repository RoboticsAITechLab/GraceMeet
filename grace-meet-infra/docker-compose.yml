services:
  livekit:
    image: livekit/livekit-server:v1.8.0
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - LIVEKIT_DOMAIN=${LIVEKIT_DOMAIN:-localhost}

volumes:
  caddy_data:
  caddy_config:
